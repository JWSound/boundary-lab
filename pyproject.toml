[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "boundary-lab"
version = "0.5.0"
description = "Boundary element loudspeaker radiation solver"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "beat-engine @ https://github.com/JWSound/BEAT_Engine/releases/download/v0.6.0/beat_engine-0.6.0-py3-none-any.whl#sha256=10db2ee28eb9a8675fa0131127a04eeaad61097328c3aac453721a5924187dd3",
  "gmsh",
  "matplotlib",
  "meshio",
  "numpy",
  "scipy",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "pytest-timeout",
  "pytest-xdist",
  "ruff>=0.15,<0.16",
]
gui = [
  "PySide6",
  "pyvista>=0.47",
  "pyvistaqt",
]

[project.scripts]
blab = "blab.cli:main"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/blab"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
timeout = 60
addopts = "-m 'not slow'"
markers = [
  "slow: slow test, skipped by default; run everything with `-n auto -m \"\"`",
]

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["src", "tests", "scripts"]
force-exclude = true
extend-exclude = [
  "ath/",
  "runs/",
  "references/",
]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"scripts/benchmark_gui_pipeline.py" = ["E402"]
