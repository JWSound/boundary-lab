name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  python-tests:
    name: Python tests
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
      MPLBACKEND: Agg
      PYTHONUTF8: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[gui,dev]"

      - name: Run Ruff
        run: |
          python -m ruff check .
          python -m ruff format --check pyproject.toml scripts src tests

      - name: Run pytest
        run: python -m pytest

  engine-integration:
    name: Published engine integration
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.12"
      - name: Install Boundary Lab and the pinned engine release
        run: python -m pip install .
      - name: Prepare the installed CPU environment
        run: python -m beat_engine instantiate --backend cpu
      - name: Validate and solve a physical project with the installed packages
        run: python scripts/check_engine_integration.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: engine-integration
          path: runs/engine-integration/
